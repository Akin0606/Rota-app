<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rotally">
  <title>Rotally favicon — thickened for 16px legibility</title>
  <g id="icon" transform="rotate(-90 256 256)" fill="none" stroke-linecap="butt">
    <circle cx="256" cy="256" r="160" stroke="#4A4A4E" stroke-width="96"
            stroke-dasharray="100.53 43.05"/>
    <circle cx="256" cy="256" r="160" stroke="#FF6B00" stroke-width="96"
            stroke-dasharray="100.53 904.86" stroke-dashoffset="-574.4"/>
  </g>
</svg>
